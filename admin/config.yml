backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "ব্লগ পোস্ট"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "শিরোনাম (Title)", name: "title", widget: "string"}
      - {label: "তারিখ (Publish Date)", name: "date", widget: "datetime"}
      - {label: "মূল লেখা (Body)", name: "body", widget: "markdown"}

