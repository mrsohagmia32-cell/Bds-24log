<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার ব্লগ</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* হেডার ও পোস্ট বাটনের স্টাইল */
    .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 15px; }
    h1 { margin: 0; color: #2c3e50; font-size: 24px; }
    .add-post-btn { background-color: #28a745; color: white; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; transition: 0.3s; }
    .add-post-btn:hover { background-color: #218838; }

    /* পোস্টের কার্ড স্টাইল */
    .post { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
    .post h2 { margin-top: 0; color: #0070f3; font-size: 20px; }
    .post-date { font-size: 0.85em; color: #777; margin-bottom: 15px; }
    .post-body { line-height: 1.6; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-area">
      <h1>ব্লগ পোস্টসমূহ</h1>
      <!-- নতুন পোস্ট করার জন্য এডমিন লিংকের বাটন -->
      <a href="/admin/" class="add-post-btn">+ নতুন পোস্ট করুন</a>
    </div>

    <div id="blog-posts">পোস্টগুলো লোড হচ্ছে...</div>
  </div>

  <script>
    async function loadPosts() {
      const repoUser = "mrsohagmia32-cell";
      const repoName = "Bds-24log";
      const postsContainer = document.getElementById("blog-posts");

      try {
        // GitHub API Caching বাইপাস করার জন্য টাইমস্ট্যাম্প যুক্ত করা হয়েছে
        const response = await fetch(`https://api.github.com/repos/${repoUser}/${repoName}/contents/posts?t=${new Date().getTime()}`);
        
        if (!response.ok) {
          postsContainer.innerHTML = "<p>এখনো কোনো পোস্ট প্রকাশ করা হয়নি!</p>";
          return;
        }

        const files = await response.json();
        postsContainer.innerHTML = "";

        // সাম্প্রতিক পোস্ট আগে দেখানোর জন্য রিভার্স করা হয়েছে
        files.reverse();

        for (const file of files) {
          if (file.name.endsWith(".md") || file.name.endsWith(".html")) {
            const res = await fetch(file.download_url + `?t=${new Date().getTime()}`);
            const text = await res.text();

            let title = file.name.replace(/\.md|\.html/g, '');
            let date = '';
            let body = text;

            // Decap CMS এর Frontmatter ডাটা পার্স করা
            const frontmatterMatch = text.match(/^---[\s\S]*?---/);
            if (frontmatterMatch) {
              const header = frontmatterMatch[0];
              body = text.replace(header, '').trim();

              const titleMatch = header.match(/title:\s*([^\n\r]+)/);
              const dateMatch = header.match(/date:\s*([^\n\r]+)/);

              if (titleMatch) title = titleMatch[1].replace(/['"]/g, '').trim();
              if (dateMatch) date = dateMatch[1].replace(/['"]/g, '').trim();
            }

            const postElement = document.createElement("div");
            postElement.className = "post";
            postElement.innerHTML = `
              <h2>${title}</h2>
              ${date ? `<div class="post-date">প্রকাশের তারিখ: ${new Date(date).toLocaleDateString('bn-BD')}</div>` : ''}
              <div class="post-body">${body}</div>
            `;
            postsContainer.appendChild(postElement);
          }
        }
      } catch (err) {
        postsContainer.innerHTML = "<p>পোস্ট লোড করতে সমস্যা হয়েছে। পেজটি রিফ্রেশ দিন।</p>";
      }
    }

    loadPosts();
  </script>
</body>
</html>
