<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার ব্লগ</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #2c3e50; }
    .post { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .post h2 { margin-top: 0; color: #0070f3; }
    .post-date { font-size: 0.85em; color: #777; margin-bottom: 15px; }
    .post-body { line-height: 1.6; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ব্লগ পোস্টসমূহ</h1>
    <div id="blog-posts">পোস্টগুলো লোড হচ্ছে...</div>
  </div>

  <script>
    async function loadPosts() {
      const repoUser = "mrsohagmia32-cell";
      const repoName = "Bds-24log";
      const postsContainer = document.getElementById("blog-posts");

      try {
        // Cache bypass করার জন্য timestamp যোগ করা হয়েছে
        const response = await fetch(`https://api.github.com/repos/${repoUser}/${repoName}/contents/posts?t=${new Date().getTime()}`);
        
        if (!response.ok) {
          postsContainer.innerHTML = "<p>এখনো কোনো পোস্ট প্রকাশ করা হয়নি বা `posts` ফোল্ডার তৈরি হয়নি!</p>";
          return;
        }

        const files = await response.json();
        postsContainer.innerHTML = "";

        if (files.length === 0) {
          postsContainer.innerHTML = "<p>কোনো পোস্ট পাওয়া যায়নি!</p>";
          return;
        }

        for (const file of files) {
          if (file.name.endsWith(".md") || file.name.endsWith(".html")) {
            const res = await fetch(file.download_url + `?t=${new Date().getTime()}`);
            const text = await res.text();

            // Decap CMS এর Frontmatter (Title, Date, Body) আলাদা করার জন্য
            let title = file.name.replace(/\.md|\.html/g, '');
            let date = '';
            let body = text;

            const frontmatterMatch = text.match(/^---[\s\S]*?---/);
            if (frontmatterMatch) {
              const header = frontmatterMatch[0];
              body = text.replace(header, '').trim();

              const titleMatch = header.match(/title:\1*([^\n\r]+)/);
              const dateMatch = header.match(/date:\1*([^\n\r]+)/);

              if (titleMatch) title = titleMatch[1].replace(/['"]/g, '').trim();
              if (dateMatch) date = dateMatch[1].replace(/['"]/g, '').trim();
            }

            const postElement = document.createElement("div");
            postElement.className = "post";
            postElement.innerHTML = `
              <h2>${title}</h2>
              ${date ? `<div class="post-date">প্রকাশের তারিখ: ${new Date(date).toLocaleDateString('bn-BD')}</div>` : ''}
              <div class="post-body">${body}</div>
            `;
            postsContainer.appendChild(postElement);
          }
        }
      } catch (err) {
        postsContainer.innerHTML = "<p>পোস্ট লোড করতে সমস্যা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।</p>";
      }
    }

    loadPosts();
  </script>
</body>
</html>
